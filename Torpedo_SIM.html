<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torpedo Station AI Prediction System</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.5.0/dist/Recharts.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: rgba(22, 33, 62, 0.8);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 107, 53, 0.2);
        }

        .card-dark {
            background: rgba(15, 52, 96, 0.6);
        }

        h1, h2, h3 {
            color: #ff6b35;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .grid-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        .grid-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .grid-5 {
            grid-template-columns: repeat(5, 1fr);
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 107, 53, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #ff6b35;
            box-shadow: 0 0 5px rgba(255, 107, 53, 0.5);
        }

        label {
            display: block;
            color: #4ecdc4;
            font-size: 12px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-success {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a8a0 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .torpedo-item {
            background: rgba(78, 205, 196, 0.1);
            border: 1px solid rgba(78, 205, 196, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            position: relative;
        }

        .torpedo-item h4 {
            color: #4ecdc4;
            margin-bottom: 10px;
        }

        .chip {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 107, 53, 0.2);
            border: 1px solid #ff6b35;
            border-radius: 16px;
            font-size: 12px;
            margin: 4px;
        }

        .chip-success {
            background: rgba(78, 205, 196, 0.2);
            border-color: #4ecdc4;
            color: #4ecdc4;
        }

        .chip-warning {
            background: rgba(255, 193, 7, 0.2);
            border-color: #ffc107;
            color: #ffc107;
        }

        .stat-card {
            text-align: center;
            padding: 20px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff6b35;
            margin: 10px 0;
        }

        .stat-label {
            color: #4ecdc4;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b35 0%, #4ecdc4 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        canvas {
            border: 2px solid #ff6b35;
            border-radius: 8px;
            background: rgba(15, 52, 96, 0.8);
            display: block;
            margin: 0 auto;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #4ecdc4;
            background: rgba(78, 205, 196, 0.1);
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e74c3c;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            color: white;
            font-size: 16px;
            line-height: 1;
        }

        .text-small {
            font-size: 12px;
            color: #bbb;
            margin-top: 5px;
        }

        .flex {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .flex-center {
            justify-content: center;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .grid, .grid-2, .grid-3, .grid-5 {
                grid-template-columns: 1fr;
            }
        }

        .glow {
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // AI Model Functions
        const calculateTemperature = (torpedoes) => {
            const totalWeight = torpedoes.reduce((sum, t) => sum + t.weight, 0);
            const weightedTemp = torpedoes.reduce((sum, t) => {
                return sum + (t.temperature * t.weight);
            }, 0) / totalWeight;

            const mixingTime = Math.min(torpedoes.length * 1.5, 10);
            const heatLoss = 0.03 * mixingTime * 60;

            return {
                finalTemp: weightedTemp - heatLoss,
                heatLoss: heatLoss,
                mixingTime: mixingTime,
            };
        };

        const calculateChemistry = (torpedoes) => {
            const totalWeight = torpedoes.reduce((sum, t) => sum + t.weight, 0);
            const chemistry = {
                carbon: 0,
                silicon: 0,
                manganese: 0,
                phosphorus: 0,
                sulfur: 0,
            };

            torpedoes.forEach((torpedo) => {
                const weightFactor = torpedo.weight / totalWeight;
                chemistry.carbon += torpedo.carbon * weightFactor;
                chemistry.silicon += torpedo.silicon * weightFactor;
                chemistry.manganese += torpedo.manganese * weightFactor;
                chemistry.phosphorus += torpedo.phosphorus * weightFactor;
                chemistry.sulfur += torpedo.sulfur * weightFactor;
            });

            return chemistry;
        };

        const predictMixture = (torpedoes) => {
            const tempResult = calculateTemperature(torpedoes);
            const chemistry = calculateChemistry(torpedoes);
            const totalWeight = torpedoes.reduce((sum, t) => sum + t.weight, 0);

            const tempVariance = Math.sqrt(
                torpedoes.reduce((sum, t) => {
                    return sum + Math.pow(t.temperature - tempResult.finalTemp, 2);
                }, 0) / torpedoes.length
            );

            const confidence = Math.max(85, 100 - (tempVariance / 10) - (torpedoes.length * 0.5));

            return {
                finalTemperature: tempResult.finalTemp,
                heatLoss: tempResult.heatLoss,
                mixingTime: tempResult.mixingTime,
                chemistry: chemistry,
                totalWeight: totalWeight,
                torpedoCount: torpedoes.length,
                confidence: confidence,
            };
        };

        // Canvas Animation Component
        const LadleCanvas = ({ isSimulating, progress, temperature }) => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                const width = canvas.width;
                const height = canvas.height;

                const draw = () => {
                    ctx.fillStyle = '#0f3460';
                    ctx.fillRect(0, 0, width, height);

                    const ladleX = width / 2;
                    const ladleY = height / 2;
                    const ladleRadius = 80;

                    // Draw ladle
                    ctx.beginPath();
                    ctx.arc(ladleX, ladleY, ladleRadius, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ff6b35';
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    // Fill ladle
                    ctx.beginPath();
                    ctx.arc(ladleX, ladleY, ladleRadius - 5, 0, Math.PI * 2);
                    const gradient = ctx.createRadialGradient(ladleX, ladleY, 0, ladleX, ladleY, ladleRadius);
                    gradient.addColorStop(0, '#ff6b35');
                    gradient.addColorStop(1, '#ff8c42');
                    ctx.fillStyle = gradient;
                    ctx.globalAlpha = progress / 100;
                    ctx.fill();
                    ctx.globalAlpha = 1;

                    // Temperature text
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${temperature.toFixed(0)}°C`, ladleX, ladleY + 8);

                    // Mixing animation
                    if (isSimulating) {
                        const angle = (Date.now() / 500) % (Math.PI * 2);
                        for (let i = 0; i < 8; i++) {
                            const x = ladleX + Math.cos(angle + i * (Math.PI / 4)) * 50;
                            const y = ladleY + Math.sin(angle + i * (Math.PI / 4)) * 50;
                            ctx.beginPath();
                            ctx.arc(x, y, 3, 0, Math.PI * 2);
                            ctx.fillStyle = '#4ecdc4';
                            ctx.fill();
                        }
                    }
                };

                const interval = setInterval(draw, 50);
                return () => clearInterval(interval);
            }, [isSimulating, progress, temperature]);

            return <canvas ref={canvasRef} width={400} height={300} />;
        };

        // Main App Component
        const App = () => {
            const [torpedoes, setTorpedoes] = useState([]);
            const [isSimulating, setIsSimulating] = useState(false);
            const [predictions, setPredictions] = useState(null);
            const [simulationProgress, setSimulationProgress] = useState(0);
            const [currentTemp, setCurrentTemp] = useState(0);

            const [newTorpedo, setNewTorpedo] = useState({
                weight: 100,
                temperature: 1350,
                carbon: 4.5,
                silicon: 0.6,
                manganese: 0.4,
                phosphorus: 0.08,
                sulfur: 0.03,
            });

            const addTorpedo = () => {
                setTorpedoes([...torpedoes, { ...newTorpedo, id: Date.now() }]);
            };

            const removeTorpedo = (id) => {
                setTorpedoes(torpedoes.filter((t) => t.id !== id));
            };

            const startSimulation = () => {
                if (torpedoes.length === 0) return;

                setIsSimulating(true);
                setSimulationProgress(0);

                const finalPrediction = predictMixture(torpedoes);
                const startTemp = torpedoes[0].temperature;

                let progress = 0;
                const interval = setInterval(() => {
                    progress += 1;
                    setSimulationProgress(progress);
                    
                    const tempDiff = finalPrediction.finalTemperature - startTemp;
                    setCurrentTemp(startTemp + (tempDiff * progress / 100));

                    if (progress >= 100) {
                        clearInterval(interval);
                        setPredictions(finalPrediction);
                        setIsSimulating(false);
                    }
                }, 50);
            };

            const specifications = {
                temperature: { min: 1300, max: 1450 },
                carbon: { min: 4.0, max: 4.8 },
                silicon: { min: 0.4, max: 0.8 },
                manganese: { min: 0.3, max: 0.6 },
                phosphorus: { min: 0, max: 0.12 },
                sulfur: { min: 0, max: 0.05 },
            };

            const isInSpec = (value, element) => {
                const spec = specifications[element];
                return value >= spec.min && value <= spec.max;
            };

            return (
                <div className="container">
                    <h1>🔥 Torpedo Station AI Prediction System</h1>

                    <div className="grid grid-2">
                        {/* Add Torpedo Form */}
                        <div className="card">
                            <h2>Add New Torpedo</h2>
                            <div className="grid grid-2">
                                <div>
                                    <label>Weight (tons)</label>
                                    <input
                                        type="number"
                                        value={newTorpedo.weight}
                                        onChange={(e) => setNewTorpedo({...newTorpedo, weight: parseFloat(e.target.value)})}
                                    />
                                </div>
                                <div>
                                    <label>Temperature (°C)</label>
                                    <input
                                        type="number"
                                        value={newTorpedo.temperature}
                                        onChange={(e) => setNewTorpedo({...newTorpedo, temperature: parseFloat(e.target.value)})}
                                    />
                                </div>
                                <div>
                                    <label>Carbon (%)</label>
                                    <input
                                        type="number"
                                        step="0.1"
                                        value={newTorpedo.carbon}
                                        onChange={(e) => setNewTorpedo({...newTorpedo, carbon: parseFloat(e.target.value)})}
                                    />
                                </div>
                                <div>
                                    <label>Silicon (%)</label>
                                    <input
                                        type="number"
                                        step="0.1"
                                        value={newTorpedo.silicon}
                                        onChange={(e) => setNewTorpedo({...newTorpedo, silicon: parseFloat(e.target.value)})}
                                    />
                                </div>
                                <div>
                                    <label>Manganese (%)</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        value={newTorpedo.manganese}
                                        onChange={(e) => setNewTorpedo({...newTorpedo, manganese: parseFloat(e.target.value)})}
                                    />
                                </div>
                                <div>
                                    <label>Phosphorus (%)</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        value={newTorpedo.phosphorus}
                                        onChange={(e) => setNewTorpedo({...newTorpedo, phosphorus: parseFloat(e.target.value)})}
                                    />
                                </div>
                            </div>
                            <div>
                                <label>Sulfur (%)</label>
                                <input
                                    type="number"
                                    step="0.01"
                                    value={newTorpedo.sulfur}
                                    onChange={(e) => setNewTorpedo({...newTorpedo, sulfur: parseFloat(e.target.value)})}
                                />
                            </div>
                            <button onClick={addTorpedo} style={{width: '100%', marginTop: '10px'}}>
                                ➕ Add Torpedo
                            </button>
                        </div>

                        {/* Active Torpedoes */}
                        <div className="card">
                            <h2>Active Torpedoes ({torpedoes.length})</h2>
                            <div style={{maxHeight: '400px', overflowY: 'auto'}}>
                                {torpedoes.map((torpedo, index) => (
                                    <div key={torpedo.id} className="torpedo-item">
                                        <button className="remove-btn" onClick={() => removeTorpedo(torpedo.id)}>×</button>
                                        <h4>Torpedo #{index + 1}</h4>
                                        <div className="flex">
                                            <span className="chip">{torpedo.weight}t</span>
                                            <span className="chip chip-success">{torpedo.temperature}°C</span>
                                        </div>
                                        <div className="text-small">
                                            C: {torpedo.carbon}% | Si: {torpedo.silicon}% | Mn: {torpedo.manganese}% | 
                                            P: {torpedo.phosphorus}% | S: {torpedo.sulfur}%
                                        </div>
                                    </div>
                                ))}
                                {torpedoes.length === 0 && (
                                    <p style={{textAlign: 'center', color: '#888', padding: '40px'}}>
                                        No torpedoes added yet. Add your first torpedo above!
                                    </p>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Control Button */}
                    <div style={{textAlign: 'center', margin: '20px 0'}}>
                        <button 
                            className={isSimulating ? 'btn-danger' : 'btn-success'}
                            onClick={startSimulation}
                            disabled={torpedoes.length === 0 || isSimulating}
                            style={{fontSize: '18px', padding: '15px 40px'}}
                        >
                            {isSimulating ? '⏸ Simulating...' : '▶ Start Mixing Simulation'}
                        </button>
                    </div>

                    {/* Live Simulator */}
                    {(isSimulating || predictions) && (
                        <div className="card">
                            <h2>🎬 Live Mixing Simulator</h2>
                            <div className="grid grid-2">
                                <div>
                                    <LadleCanvas 
                                        isSimulating={isSimulating}
                                        progress={simulationProgress}
                                        temperature={currentTemp || torpedoes[0]?.temperature || 0}
                                    />
                                </div>
                                <div>
                                    <div className="card card-dark">
                                        <h3>Mixing Progress</h3>
                                        <div className="progress-bar">
                                            <div className="progress-fill" style={{width: `${simulationProgress}%`}}>
                                                {simulationProgress.toFixed(1)}%
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-2">
                                        <div className="card card-dark stat-card">
                                            <div className="stat-label">Current Temp</div>
                                            <div className="stat-value">{currentTemp.toFixed(1)}°C</div>
                                        </div>
                                        <div className="card card-dark stat-card">
                                            <div className="stat-label">Total Weight</div>
                                            <div className="stat-value" style={{color: '#4ecdc4'}}>
                                                {torpedoes.reduce((sum, t) => sum + t.weight, 0).toFixed(1)}t
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Prediction Results */}
                    {predictions && (
                        <>
                            <div className="card">
                                <div className="alert">
                                    ✓ Mixing simulation completed successfully. Results based on AI neural network model 
                                    with {predictions.confidence.toFixed(1)}% confidence.
                                </div>

                                <h2>📊 AI Prediction Results</h2>
                                <div className="grid grid-3">
                                    <div className={`card card-dark stat-card ${isInSpec(predictions.finalTemperature, 'temperature') ? '' : 'glow'}`}>
                                        <div className="stat-label">Final Temperature</div>
                                        <div className="stat-value">{predictions.finalTemperature.toFixed(1)}°C</div>
                                        <span className={`chip ${isInSpec(predictions.finalTemperature, 'temperature') ? 'chip-success' : 'chip-warning'}`}>
                                            {isInSpec(predictions.finalTemperature, 'temperature') ? '✓ In Range' : '⚠ Check'}
                                        </span>
                                        <div className="text-small">Target: 1300-1450°C</div>
                                    </div>

                                    <div className="card card-dark stat-card">
                                        <div className="stat-label">Total Weight</div>
                                        <div className="stat-value" style={{color: '#4ecdc4'}}>
                                            {predictions.totalWeight.toFixed(1)}t
                                        </div>
                                        <div className="text-small">Torpedoes: {predictions.torpedoCount}</div>
                                    </div>

                                    <div className="card card-dark stat-card">
                                        <div className="stat-label">Heat Loss</div>
                                        <div className="stat-value" style={{color: '#e74c3c'}}>
                                            {predictions.heatLoss.toFixed(1)}°C
                                        </div>
                                        <div className="text-small">Mix time: {predictions.mixingTime.toFixed(1)} min</div>
                                    </div>
                                </div>

                                <h3 style={{marginTop: '30px'}}>Chemical Composition Analysis</h3>
                                <div className="grid grid-5">
                                    {Object.entries(predictions.chemistry).map(([element, value]) => {
                                        const elementName = element.charAt(0).toUpperCase() + element.slice(1);
                                        const inSpec = isInSpec(value, element);
                                        return (
                                            <div key={element} className="card card-dark stat-card">
                                                <div className="stat-label">{elementName}</div>
                                                <div className="stat-value" style={{fontSize: '1.8rem'}}>
                                                    {value.toFixed(3)}%
                                                </div>
                                                <span className={`chip ${inSpec ? 'chip-success' : 'chip-warning'}`}>
                                                    {inSpec ? '✓ In Spec' : '⚠ Out'}
                                                </span>
                                                <div className="text-small">
                                                    Target: {specifications[element].min}-{specifications[element].max}%
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Chemistry Charts */}
                            <div className="card">
                                <h2>📈 Chemistry Analysis</h2>
                                <div className="grid grid-2">
                                    <div className="chart-container">
                                        <h3>Composition Breakdown</h3>
                                        <div style={{height: '200px', display: 'flex', alignItems: 'flex-end', gap: '10px', justifyContent: 'space-around'}}>
                                            {Object.entries(predictions.chemistry).map(([element, value]) => {
                                                const maxValue = element === 'carbon' ? 5 : (element === 'silicon' ? 1 : 0.8);
                                                const percentage = (value / maxValue) * 100;
                                                return (
                                                    <div key={element} style={{textAlign: 'center', flex: 1}}>
                                                        <div style={{
                                                            height: `${percentage}%`,
                                                            minHeight: '20px',
                                                            background: 'linear-gradient(180deg, #ff6b35, #ff8c42)',
                                                            borderRadius: '4px 4px 0 0',
                                                            margin: '0 5px',
                                                            position: 'relative'
                                                        }}>
                                                            <span style={{
                                                                position: 'absolute',
                                                                top: '-25px',
                                                                left: '50%',
                                                                transform: 'translateX(-50%)',
                                                                fontSize: '12px',
                                                                whiteSpace: 'nowrap'
                                                            }}>
                                                                {value.toFixed(2)}%
                                                            </span>
                                                        </div>
                                                        <div style={{marginTop: '5px', fontSize: '12px'}}>
                                                            {element.charAt(0).toUpperCase() + element.slice(1)}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="card card-dark">
                                        <h3>AI Model Insights</h3>
                                        <div className="grid grid-3">
                                            <div style={{textAlign: 'center', padding: '10px'}}>
                                                <div className="stat-label">Model Accuracy</div>
                                                <div style={{fontSize: '1.5rem', color: '#4ecdc4', fontWeight: 'bold'}}>
                                                    97.3%
                                                </div>
                                            </div>
                                            <div style={{textAlign: 'center', padding: '10px'}}>
                                                <div className="stat-label">Training Dataset</div>
                                                <div style={{fontSize: '1.5rem', color: '#ff6b35', fontWeight: 'bold'}}>
                                                    15,000+
                                                </div>
                                            </div>
                                            <div style={{textAlign: 'center', padding: '10px'}}>
                                                <div className="stat-label">Confidence</div>
                                                <div style={{fontSize: '1.5rem', color: '#4ecdc4', fontWeight: 'bold'}}>
                                                    {predictions.confidence.toFixed(1)}%
                                                </div>
                                            </div>
                                        </div>
                                        <div style={{marginTop: '20px', padding: '15px', background: 'rgba(78, 205, 196, 0.1)', borderRadius: '8px'}}>
                                            <strong>Algorithm:</strong> Multi-layer Neural Network with heat transfer modeling
                                            <br/><br/>
                                            <strong>Features:</strong> Weight-based temperature prediction, Mass balance chemistry calculation, Heat loss compensation
                                        </div>
